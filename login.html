<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CEO OS — Login</title>
  <style>
    /* ── Reset & base ───────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, "SF Pro Display", "SF Pro Text", BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      background: radial-gradient(ellipse at 50% 30%, #2a3145 0%, #1c2130 40%, #141820 100%);
      color: #ffffff;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Card container ─────────────────────────────────────────── */
    .card {
      width: 100%;
      max-width: 380px;
      padding: 56px 40px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    /* ── Logo ───────────────────────────────────────────────────── */
    .logo-wrap {
      margin-bottom: 28px;
    }

    .logo-wrap svg {
      width: 72px;
      height: 72px;
      filter: drop-shadow(0 2px 12px rgba(255,255,255,0.12));
    }

    /* ── Headline ───────────────────────────────────────────────── */
    .headline {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.5px;
      color: #f0f2f5;
      text-align: center;
      margin-bottom: 10px;
    }

    .subtext {
      font-size: 14px;
      font-weight: 400;
      color: #8a9ab5;
      text-align: center;
      line-height: 1.5;
      margin-bottom: 36px;
      letter-spacing: 0.1px;
    }

    /* ── Form ───────────────────────────────────────────────────── */
    .form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .input-field {
      width: 100%;
      padding: 15px 18px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      color: #e8ecf2;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
      -webkit-appearance: none;
    }

    .input-field::placeholder {
      color: #5a6b85;
    }

    .input-field:focus {
      border-color: rgba(255, 255, 255, 0.30);
      background: rgba(255, 255, 255, 0.09);
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.04);
    }

    /* ── Log In button ──────────────────────────────────────────── */
    .btn-login {
      margin-top: 6px;
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      font-family: inherit;
      letter-spacing: 0.2px;
      color: #e8ecf2;
      cursor: pointer;
      outline: none;
      position: relative;
      overflow: hidden;

      /* Dark glossy gradient matching the mockup */
      background: linear-gradient(180deg, #2e3346 0%, #1a1e2b 50%, #151820 100%);
      border: 1px solid rgba(255,255,255,0.14);
      box-shadow:
        0 1px 0 rgba(255,255,255,0.10) inset,
        0 -1px 0 rgba(0,0,0,0.40) inset,
        0 4px 16px rgba(0,0,0,0.35);

      transition: transform 0.12s ease, box-shadow 0.12s ease, opacity 0.12s ease;
    }

    /* Subtle inner top shine */
    .btn-login::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 48%;
      background: linear-gradient(180deg, rgba(255,255,255,0.07) 0%, rgba(255,255,255,0) 100%);
      border-radius: 12px 12px 0 0;
      pointer-events: none;
    }

    .btn-login:hover {
      opacity: 0.88;
      box-shadow:
        0 1px 0 rgba(255,255,255,0.10) inset,
        0 -1px 0 rgba(0,0,0,0.40) inset,
        0 6px 20px rgba(0,0,0,0.45);
    }

    .btn-login:active {
      transform: scale(0.98);
      box-shadow:
        0 1px 0 rgba(255,255,255,0.06) inset,
        0 -1px 0 rgba(0,0,0,0.40) inset,
        0 2px 8px rgba(0,0,0,0.30);
    }

    /* ── Face ID ────────────────────────────────────────────────── */
    .faceid-wrap {
      margin-top: 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      opacity: 0.75;
      transition: opacity 0.2s ease;
    }

    .faceid-wrap:hover { opacity: 1; }

    .faceid-wrap svg {
      width: 36px;
      height: 36px;
    }

    .faceid-label {
      font-size: 12px;
      font-weight: 500;
      color: #8a9ab5;
      letter-spacing: 0.4px;
    }

    /* ── Divider ────────────────────────────────────────────────── */
    .divider {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 32px;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.08);
    }

    .divider-text {
      font-size: 12px;
      color: #4a5872;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    /* ── Links ──────────────────────────────────────────────────── */
    .links {
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
      width: 100%;
    }

    .link {
      font-size: 13px;
      color: #6a7fa0;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    .link:hover { color: #a0b0cc; }

    /* ── Home indicator (decorative) ────────────────────────────── */
    .home-bar {
      width: 134px;
      height: 5px;
      background: rgba(255,255,255,0.25);
      border-radius: 3px;
      margin-top: 44px;
    }

    /* ── Responsive ─────────────────────────────────────────────── */
    @media (max-width: 440px) {
      .card { padding: 48px 28px 40px; }
      .headline { font-size: 24px; }
    }
  </style>
</head>
<body>

  <div class="card">

    <!-- Logo -->
    <div class="logo-wrap">
      <svg viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Orbital ring -->
        <ellipse cx="36" cy="36" rx="30" ry="30"
          stroke="rgba(255,255,255,0.70)" stroke-width="1.5"
          stroke-dasharray="3 2.5"
          fill="none"
          transform="rotate(-30 36 36)" />

        <!-- Bar chart bars -->
        <rect x="16" y="42" width="7" height="10" rx="1.5" fill="white" opacity="0.90"/>
        <rect x="26" y="34" width="7" height="18" rx="1.5" fill="white" opacity="0.90"/>
        <rect x="36" y="26" width="7" height="26" rx="1.5" fill="white" opacity="0.90"/>
        <rect x="46" y="20" width="7" height="32" rx="1.5" fill="white" opacity="0.90"/>

        <!-- Rocket / arrow indicator -->
        <g transform="translate(48, 14) rotate(45)">
          <polygon points="0,-7 5,4 0,2 -5,4" fill="white" opacity="0.95"/>
          <line x1="0" y1="2" x2="0" y2="9" stroke="white" stroke-width="1.5" opacity="0.70"/>
        </g>
      </svg>
    </div>

    <!-- Heading -->
    <h1 class="headline">Welcome back, CEO.</h1>
    <p class="subtext">The layer between company data and your decisions.</p>

    <!-- Form -->
    <form class="form" onsubmit="return false;">
      <input class="input-field" type="email" placeholder="Email Address" autocomplete="email" />
      <input class="input-field" type="password" placeholder="Password" autocomplete="current-password" />
      <button class="btn-login" type="submit">Log In</button>
    </form>

    <!-- Face ID -->
    <div class="faceid-wrap" role="button" aria-label="Sign in with Face ID" tabindex="0">
      <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Corner brackets -->
        <path d="M4 12V6a2 2 0 0 1 2-2h6" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M32 12V6a2 2 0 0 0-2-2h-6" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M4 24v6a2 2 0 0 0 2 2h6" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M32 24v6a2 2 0 0 1-2 2h-6" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
        <!-- Eyes -->
        <circle cx="13" cy="15" r="1.2" fill="white"/>
        <circle cx="23" cy="15" r="1.2" fill="white"/>
        <!-- Nose line -->
        <path d="M18 15v4" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
        <!-- Smile -->
        <path d="M13 22 Q18 26 23 22" stroke="white" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      </svg>
      <span class="faceid-label">Face ID</span>
    </div>

    <!-- Divider + links -->
    <div class="divider">
      <div class="divider-line"></div>
      <span class="divider-text">OR</span>
      <div class="divider-line"></div>
    </div>

    <div class="links">
      <a href="#" class="link">Forgot Password?</a>
      <a href="#" class="link">Request Access</a>
    </div>

    <!-- Home bar decoration -->
    <div class="home-bar"></div>

  </div>

</body>
</html>
